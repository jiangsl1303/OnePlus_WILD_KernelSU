name: probe-susfs
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe archive URLs
        shell: bash
        run: |
          set -uo pipefail
          SHA12=077730110ca6
          SHA40=077730110ca6d389c6d39df4d43529b3189b5189
          BASE="https://gitlab.com/simonpunk/susfs4ksu"
          probe() {
            local url="$1"
            local out
            out=$(curl -sS -o /dev/null -w "%{http_code} %{size_download} %{time_total}" -L --max-time 60 "$url" 2>&1) || out="CURLFAIL: $out"
            echo "  [$out]  $url"
          }
          echo "### 1. /-/archive/ 各种 ref"
          probe "$BASE/-/archive/gki-android14-6.1/susfs4ksu-gki-android14-6.1.tar.gz"
          probe "$BASE/-/archive/$SHA12/susfs4ksu-$SHA12.tar.gz"
          probe "$BASE/-/archive/$SHA40/susfs4ksu-$SHA40.tar.gz"
          probe "$BASE/-/archive/$SHA12/x.tar.gz"
          probe "$BASE/-/archive/$SHA12"

          echo "### 2. /-/raw/"
          probe "$BASE/-/raw/$SHA12/kernel_patches/include/linux/susfs.h"
          probe "$BASE/-/raw/gki-android14-6.1/kernel_patches/include/linux/susfs.h"

          echo "### 3. api v4 archive"
          probe "https://gitlab.com/api/v4/projects/simonpunk%2Fsusfs4ksu/repository/archive.tar.gz?sha=$SHA12"

          echo "### 4. git ls-remote / fetch by sha"
          timeout 60 git ls-remote "$BASE.git" refs/heads/gki-android14-6.1 2>&1 | head -3 || echo "ls-remote FAIL"
          rm -rf /tmp/g && mkdir -p /tmp/g && cd /tmp/g
          git init -q .
          git remote add origin "$BASE.git"
          if timeout 120 git fetch --depth 1 origin "$SHA12" 2>&1 | tail -3; then
            echo "fetch-by-12sha OK"
            git rev-parse FETCH_HEAD
          else
            echo "fetch-by-12sha FAIL"
          fi

          echo "### 5. aria2c 直连（打印真实报错）"
          which aria2c || echo "aria2c 未安装"
          aria2c -x16 -s16 -j16 -k1M --retry-wait=2 --max-tries=2 \
            -d /tmp -o t1.tar.gz --allow-overwrite=true \
            --header="User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            "$BASE/-/archive/$SHA12/susfs4ksu_$SHA12.tar.gz" 2>&1 | tail -20
          ls -la /tmp/t1.tar.gz 2>&1 || true
