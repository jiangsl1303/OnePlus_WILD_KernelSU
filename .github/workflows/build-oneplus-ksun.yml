####################################################################################
#  一键构建「指定一加设备」的 KernelSU-Next 版 GKI 内核 AK3 刷机包
#
#  用法：
#    1. Fork https://github.com/WildKernels/OnePlus_KernelSU_SUSFS
#    2. 把本文件放到 fork 仓库的 .github/workflows/ 目录下
#    3. Actions → Build OnePlus Kernel (KernelSU-Next + SUSFS) → Run workflow
#    4. 在 device 输入框里填型号关键字（OP13 / OP13,OP12 / oneplus_13 / 13 / all）
#
#  特点：
#    - 每次运行都从上游拉取最新的 configs/ 与 manifests/，永远构建最新内核源码
#    - 支持精确到单一机型，也支持一次构建全部机型
#    - 复用上游 build-kernel action（编译 / 打包 AK3 / 上传产物 / ccache 缓存全自动）
#    - 产物直接是 AnyKernel3 zip，可在 KernelSU Manager 或 TWRP 里直接刷入
####################################################################################

name: Build OnePlus Kernel (KernelSU-Next + SUSFS)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      device:
        description: >-
          设备选择：all = 全部设备；或型号关键字（逗号分隔可多选）。
          例：OP13 / OP13,OP12 / oneplus_13 / 13 / ace5 / pad3
        required: true
        type: string
        default: 'all'

      android_version:
        description: 'Android 大版本过滤（auto = 不限，构建该设备所有版本）'
        required: true
        type: choice
        options:
          - auto
          - A14
          - A15
          - A16
        default: 'auto'

      ksu_ref:
        description: >-
          KernelSU-Next 分支或 commit。默认钉到 234f6e04（= KSUN 33239），
          因为上游 kernel_patches 的 SUSFS v2.2.0 修复补丁只适配到该版本；
          填 dev 会取到过新的 KernelSU-Next，导致 SUSFS 修复补丁打不上而失败。
        required: true
        type: string
        default: '234f6e040fcbca18b16d2398e1aa225712ec99ad'

      susfs_ref:
        description: >-
          SUSFS 源码引用。auto(默认) = 钉到各内核分支 2026-08-11 的提交
          （与 kernel_patches 的 v2.2.0 修复补丁、KSUN 33239 严格配对；取分支头
          会因 v2.3.0 报 Unsupported SUSFS version，取更晚的 v2.2.0 提交会因
          .rej 文件没有对应 fix_*.patch 而失败）；latest = 跟随分支头；
          也可直接填 40 位 commit 或分支名。
        required: true
        type: string
        default: 'auto'

      optimize_level:
        description: '编译优化等级'
        required: true
        type: choice
        options:
          - O2
          - O3
        default: 'O2'

      clean_build:
        description: '禁用 ccache 缓存（clean build，更慢但更干净）'
        required: false
        type: boolean
        default: false

      make_release:
        description: '构建成功后创建 Release（方便长期保存和分享）'
        required: false
        type: boolean
        default: false

      list_only:
        description: '只列出匹配到的设备，不执行构建（用来查设备关键字）'
        required: false
        type: boolean
        default: false

      debug:
        description: '输出详细调试日志'
        required: false
        type: boolean
        default: false

concurrency:
  group: oneplus-ksun-${{ github.ref }}-${{ inputs.device }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # Job 1: 解析设备选择 → 生成构建矩阵
  # ===========================================================================
  resolve:
    name: Resolve devices
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      count: ${{ steps.gen.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sync latest configs & manifests from upstream
        run: |
          set -euo pipefail
          echo "::group::Sync upstream"
          curl -fsSL --retry 3 --retry-delay 5 -o upstream.tar.gz \
            "https://codeload.github.com/WildKernels/OnePlus_KernelSU_SUSFS/tar.gz/refs/heads/main"
          tar xzf upstream.tar.gz
          rm -rf configs manifests
          cp -r OnePlus_KernelSU_SUSFS-main/configs ./configs
          cp -r OnePlus_KernelSU_SUSFS-main/manifests ./manifests
          rm -rf OnePlus_KernelSU_SUSFS-main upstream.tar.gz
          echo "config files : $(find configs -name '*.json' | wc -l)"
          echo "manifest files: $(find manifests -name '*.xml' | wc -l)"
          echo "::endgroup::"

      - name: Generate build matrix
        id: gen
        shell: bash
        env:
          DEVICE_INPUT: ${{ inputs.device }}
          AV_INPUT: ${{ inputs.android_version }}
          KSU_REF: ${{ inputs.ksu_ref }}
          SUSFS_REF: ${{ inputs.susfs_ref }}
        run: |
          set -euo pipefail
          echo "::group::Generate matrix"

          shopt -s nullglob
          files=(configs/*/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::上游 configs 为空，同步失败。"
            exit 1
          fi

          # 1) 汇总全部设备配置
          jq -s '.' "${files[@]}" > /tmp/all_configs.json

          # 2) Android 版本过滤
          if [ "$AV_INPUT" != "auto" ]; then
            jq -c --arg av "$AV_INPUT" 'map(select(.os_version == $av))' \
              /tmp/all_configs.json > /tmp/stage1.json
          else
            jq -c '.' /tmp/all_configs.json > /tmp/stage1.json
          fi

          total_av=$(jq 'length' /tmp/stage1.json)
          if [ "$total_av" -eq 0 ]; then
            echo "::error::在 Android 版本 '$AV_INPUT' 下没有任何设备配置。"
            exit 1
          fi

          # 3) 设备关键字过滤
          #    匹配优先级：精确 model → model 前缀 → model/manifest 包含
          device_lc=$(echo "$DEVICE_INPUT" | tr '[:upper:]' '[:lower:]' | xargs)

          if [ "$device_lc" = "all" ] || [ "$device_lc" = "*" ] || [ -z "$device_lc" ]; then
            cp /tmp/stage1.json /tmp/stage2.json
          else
            echo '[]' > /tmp/stage2.json
            IFS=',' read -ra tokens <<< "$device_lc"
            for raw_token in "${tokens[@]}"; do
              token=$(echo "$raw_token" | xargs)
              [ -z "$token" ] && continue

              # 1) 型号名「边界前缀」匹配：
              #    OP13 → 命中 OP13 / OP13-6.6.30 / OP13-CPH，但不会误命中 OP13T / OP13S
              hit=$(jq -c --arg t "$token" \
                '[.[] | select((.model | ascii_downcase) as $m
                   | ($m == $t)
                     or ($m | startswith($t + "-"))
                     or ($m | startswith($t + "_"))
                     or ($m | startswith($t + ".")))]' /tmp/stage1.json)
              # 2) manifest 文件名边界前缀匹配：
              #    oneplus_13 → oneplus_13_6.6.30_v.xml，但不会命中 oneplus_13t_*
              if [ "$(echo "$hit" | jq 'length')" -eq 0 ]; then
                hit=$(jq -c --arg t "$token" \
                  '[.[] | select((.manifest | ascii_downcase) as $f
                     | ($f == $t)
                       or ($f | startswith($t + "_"))
                       or ($f | startswith($t + "-"))
                       or ($f | startswith($t + ".")))]' /tmp/stage1.json)
              fi
              # 3) 归一化前缀匹配（忽略 - _ . 分隔符）：
              #    pad3 → OP-PAD-3-*   /   ace5pro → OP-ACE-5-PRO*   /   13 → OP13*
              if [ "$(echo "$hit" | jq 'length')" -eq 0 ]; then
                token_norm=$(echo "$token" | sed 's/[._-]//g')
                hit=$(jq -c --arg t "$token_norm" \
                  'def norm: ascii_downcase | gsub("[._-]"; "");
                   [.[] | select((.model | norm) as $m
                      | ($m | startswith($t)) or ($m | startswith("op" + $t)))]' \
                  /tmp/stage1.json)
              fi
              # 4) 最终兜底：归一化后的包含匹配
              if [ "$(echo "$hit" | jq 'length')" -eq 0 ]; then
                token_norm=$(echo "$token" | sed 's/[._-]//g')
                hit=$(jq -c --arg t "$token_norm" \
                  'def norm: ascii_downcase | gsub("[._-]"; "");
                   [.[] | select(((.model | norm) | contains($t))
                      or ((.manifest | norm) | contains($t)))]' \
                  /tmp/stage1.json)
              fi

              n=$(echo "$hit" | jq 'length')
              if [ "$n" -eq 0 ]; then
                echo "::warning::关键字 '$token' 没有匹配到任何设备，已跳过。"
              else
                echo "关键字 '$token' 匹配到 $n 个配置。"
              fi
              jq -n --argjson a "$(cat /tmp/stage2.json)" --argjson b "$hit" '$a + $b' > /tmp/stage2.tmp
              mv /tmp/stage2.tmp /tmp/stage2.json
            done
            # 去重（同 model + 同 os_version 只保留一条）
            jq -c 'unique_by(.model + "|" + .os_version)' /tmp/stage2.json > /tmp/stage2.dedup
            mv /tmp/stage2.dedup /tmp/stage2.json
          fi

          count=$(jq 'length' /tmp/stage2.json)
          if [ "$count" -eq 0 ]; then
            echo "::error::没有匹配到任何设备。可用的设备关键字示例："
            jq -r '.[] | "  - \(.model)  [\(.os_version)]  (\(.android_version)-\(.kernel_version))"' \
              /tmp/all_configs.json | head -40
            exit 1
          fi

          echo "共匹配到 $count 个设备配置。"

          # 4) 解析 KernelSU-Next 的 commit（保证可复现）
          echo "解析 KernelSU-Next ref: $KSU_REF ..."
          ksu_resolved=""
          for i in 1 2 3; do
            ksu_resolved=$(curl -fsSL --retry 2 \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/commits/${KSU_REF}" \
              2>/dev/null | jq -r '.sha // empty' || true)
            [ -n "$ksu_resolved" ] && break
            echo "  第 $i 次解析失败，重试..."
            sleep 5
          done
          if [ -z "$ksu_resolved" ]; then
            echo "::warning::无法解析 KernelSU-Next 的 '$KSU_REF'，将把分支名直接传给构建器。"
            ksu_resolved="$KSU_REF"
          fi
          echo "KernelSU-Next → $ksu_resolved"

          # 4.1) 提示：KernelSU-Next 版本必须与 SUSFS 修复补丁集匹配
          #      上游 kernel_patches 的 v2.2.0 修复补丁是按 KSUN 33239 生成的
          #      （见其提交信息 “Update KSUN 33239 SusFS 2.2.0 + KSU_Toolkit”）。
          #      KernelSU-Next 更新后，10_enable_susfs_for_ksu.patch 会产生新的 .rej 文件，
          #      而对应 fix_*.patch 不存在，导致构建报
          #      “fix_xxx.patch: No such file or directory” 而失败。
          case "$KSU_REF" in
            dev|latest|main|next|HEAD|master)
              if [ "${SUSFS_REF:-auto}" != "latest" ]; then
                echo "::warning::ksu_ref=$KSU_REF 是滚动分支，版本可能已超过 KSUN 33239；SUSFS v2.2.0 修复补丁只适配到 33239。若构建失败，请改用默认值 234f6e040fcbca18b16d2398e1aa225712ec99ad。"
              fi
              ;;
          esac

          # 5) 解析每个内核版本对应的 SUSFS 引用
          #
          #    背景：这是一组「必须成对」的版本。
          #    · 上游 WildKernels/kernel_patches 的 next/susfs_fix_patches 只提供到 v2.2.0，
          #      且其 v2.2.0 目录是按 KSUN 33239 生成的
          #      （提交信息：“Update KSUN 33239 SusFS 2.2.0 + KSU_Toolkit”，2026-08-11）。
          #    · susfs4ksu 各 gki-* 分支已于 2026-08-30 升到 v2.3.0，取分支头会直接报
          #      “Unsupported SUSFS version: v2.3.0”。
          #    · SUSFS 太新或 KSU 太新，10_enable_susfs_for_ksu.patch 都会在更多文件上产生
          #      .rej，而对应 fix_*.patch 不存在 → 构建报
          #      “fix_xxx.patch: No such file or directory” 而失败。
          #
          #    所以两边一起钉：
          #      SUSFS = 各分支在 2026-08-11（kernel_patches v2.2.0 最后一次更新）时的提交
          #      KSU   = 234f6e04（该日期的 dev HEAD，版本号 33239）
          #    已用 `patch -p1 --forward` 实测：7 个分支产生的 .rej 恰好等于
          #    {Kbuild, init.c, kernel_umount.c, setuid_hook.c, sucompat.c, supercall.c}，
          #    与 v2.2.0 目录下的 6 个 fix_*.patch 一一对应。
          #
          #    上游补齐 v2.3.0 修复补丁后，把 susfs_ref 设为 latest 并把 ksu_ref 改回 dev。
          #
          #    注意：这里刻意用 12 位短 SHA。gitlab.com 的 WAF 会对 URL 路径里
          #    完整的 40 位十六进制串直接返回 403（Cloudflare 挑战页），短 SHA 不受影响，
          #    而 GitLab 的 /-/archive/<ref>/ 与 /-/raw/<ref>/ 都能正常解析短 SHA。
          declare -A SUSFS_V220=(
            ["android12-5.10"]="3c14ad549f82"
            ["android13-5.10"]="f81aaf10e956"
            ["android13-5.15"]="ccb1918684b2"
            ["android14-5.15"]="0463ac089308"
            ["android14-6.1"]="e287d5906638"
            ["android15-6.6"]="be7b7ef49a1e"
            ["android16-6.12"]="f37930f374ef"
          )

          # action.yml 的 case 分支能识别的版本集合
          susfs_supported() {
            case "$1" in
              v1.5.8|v1.5.9|v1.5.10|v1.5.11|v1.5.12|v2.0.0|v2.1.0|v2.2.0) return 0 ;;
              *) return 1 ;;
            esac
          }

          # 读取某个 ref 的 susfs.h 中声明的版本号（纯 bash 解析，避免管道 SIGPIPE 噪音）
          susfs_version_of() {
            local body
            body=$(curl -fsSL --retry 2 --retry-delay 3 --max-time 40 \
              "https://gitlab.com/simonpunk/susfs4ksu/-/raw/$1/kernel_patches/include/linux/susfs.h" \
              2>/dev/null || true)
            body=${body//$'\r'/}
            if [[ $body =~ \#define\ SUSFS_VERSION\ \"([^\"]*)\" ]]; then
              printf '%s' "${BASH_REMATCH[1]}"
            fi
          }

          declare -A susfs_map
          mapfile -t active_keys < <(
            jq -r '[.[] | select(.susfs == true) | "\(.android_version)-\(.kernel_version)"] | unique | .[]' \
              /tmp/stage2.json | tr -d '\r'
          )
          for key in "${active_keys[@]}"; do
            branch="gki-${key}"
            sha=""
            case "${SUSFS_REF:-auto}" in
              ''|auto|pinned)
                sha="${SUSFS_V220[$key]:-}"
                if [ -n "$sha" ]; then
                  ver=$(susfs_version_of "$sha")
                  if [ -n "$ver" ] && ! susfs_supported "$ver"; then
                    echo "::warning::SUSFS [$key] 钉定提交 $sha 报告 $ver，不在 action 支持列表内。"
                  fi
                  echo "SUSFS [$key] → 钉定 ${sha:0:12} (配对提交${ver:+, 实测 $ver})"
                else
                  echo "::warning::SUSFS [$key] 无内置钉定值，回退分支头 $branch。"
                  sha="$branch"
                fi
                ;;
              latest|branch|head)
                sha="$branch"
                ver=$(susfs_version_of "$sha")
                if [ -n "$ver" ] && ! susfs_supported "$ver"; then
                  sha="${SUSFS_V220[$key]:-$branch}"
                  echo "::warning::SUSFS [$key] 分支头 $branch 报告 $ver，上游 action 尚不支持；已回退钉定值 ${sha}。"
                fi
                echo "SUSFS [$key] → $sha${ver:+, 分支头版本 $ver}"
                ;;
              *)
                sha="$SUSFS_REF"
                echo "SUSFS [$key] → 用户指定 $sha"
                ;;
            esac
            susfs_map["$key"]="$sha"
          done

          # 6) 注入 ksu / susfs 字段，生成最终 matrix
          jq -c --arg kh "$ksu_resolved" --arg kr "$KSU_REF" \
            'map(. + {ksu_type: "KSUN", ksu_hash: $kr, ksu_resolved_hash: $kh})' \
            /tmp/stage2.json > /tmp/final.json

          for key in "${!susfs_map[@]}"; do
            jq -c --arg k "$key" --arg s "${susfs_map[$key]}" \
              'map(if (.android_version + "-" + .kernel_version) == $k
                   then . + {susfs_resolved_hash: $s} else . end)' \
              /tmp/final.json > /tmp/final.tmp
            mv /tmp/final.tmp /tmp/final.json
          done

          jq -c '{include: .}' /tmp/final.json > /tmp/matrix.json
          matrix_json=$(cat /tmp/matrix.json)

          echo "count=$count" >> "$GITHUB_OUTPUT"
          {
            echo "matrix<<MATRIX_EOF"
            echo "$matrix_json"
            echo "MATRIX_EOF"
          } >> "$GITHUB_OUTPUT"

          # 7) 写入 Job Summary，方便核对
          {
            echo "## 将要构建的设备（$count 个）"
            echo ""
            echo "| 型号 | OS | 内核 | SoC | 分支 | KSU | SUSFS |"
            echo "|------|----|------|-----|------|-----|-------|"
            jq -r '.[] | "| \(.model) | \(.os_version) | \(.android_version)-\(.kernel_version) | \(.soc) | \(.branch) | KSUN | `\(.susfs_resolved_hash)` |"' /tmp/final.json
            echo ""
            echo "> SUSFS 与 KernelSU-Next 是**成对钉定**的：SUSFS 取各分支 2026-08-11 的提交，KSU 取 234f6e04（KSUN 33239），"
            echo "> 与上游 \`kernel_patches\` 的 v2.2.0 修复补丁严格对应。上游补出 v2.3.0 补丁后，把 \`susfs_ref\` 设为 \`latest\`、\`ksu_ref\` 改回 \`dev\` 即可。"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::endgroup::"

  # ===========================================================================
  # Job 2: 并行构建
  # ===========================================================================
  build:
    name: build (${{ matrix.model }} / ${{ matrix.os_version }} / KSUN)
    needs: resolve
    if: ${{ needs.resolve.result == 'success' && !inputs.list_only }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # build-kernel action 会从 ../manifests/<os_version>/ 读取 manifest，必须在 workspace 根准备好
      - name: Sync latest configs & manifests from upstream
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 -o upstream.tar.gz \
            "https://codeload.github.com/WildKernels/OnePlus_KernelSU_SUSFS/tar.gz/refs/heads/main"
          tar xzf upstream.tar.gz
          rm -rf configs manifests
          cp -r OnePlus_KernelSU_SUSFS-main/configs ./configs
          cp -r OnePlus_KernelSU_SUSFS-main/manifests ./manifests
          rm -rf OnePlus_KernelSU_SUSFS-main upstream.tar.gz

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential clang lld flex bison \
            libelf-dev libssl-dev libncurses-dev zlib1g-dev liblz4-tool \
            libxml2-utils rsync unzip dwarves file python3 python3-requests \
            ccache jq bc dos2unix kmod libdw-dev elfutils pigz aria2
          sudo apt-get clean

      - name: Configure ccache
        if: ${{ !inputs.clean_build }}
        run: |
          set -euo pipefail
          if ! command -v ccache >/dev/null 2>&1; then
            echo "ccache 不可用，跳过配置"
            exit 0
          fi
          CACHE_DIR="${GITHUB_WORKSPACE}/.ccache"
          CCACHE_LOG="${GITHUB_WORKSPACE}/ccache.log"
          mkdir -p "$CACHE_DIR"
          cat >> "$GITHUB_ENV" <<EOF
          CCACHE_DIR=${CACHE_DIR}
          CCACHE_MAXSIZE=12G
          CCACHE_COMPILERCHECK=content
          CCACHE_BASEDIR=${GITHUB_WORKSPACE}
          CCACHE_NOHASHDIR=true
          CCACHE_IGNOREOPTIONS=--sysroot*
          CCACHE_COMPRESSION=true
          CCACHE_COMPRESSION_LEVEL=3
          CCACHE_DIRECT=true
          CCACHE_FILE_CLONE=true
          CCACHE_INODE_CACHE=true
          CCACHE_IS_KERNEL_COMPILING=true
          CCACHE_UMASK=002
          CCACHE_LOGFILE=${CCACHE_LOG}
          CCACHE_SLOPPINESS=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,system_headers,locale
          EOF
          ccache --version | head -1

      - name: Prepare op_config_json
        id: prepare_config
        shell: bash
        run: |
          echo "config_json=$(jq -nc --argjson m '${{ toJSON(matrix) }}' \
            '$m | del(.ksu_type, .ksu_hash, .ksu_resolved_hash, .susfs_resolved_hash)')" >> "$GITHUB_OUTPUT"

      - name: Build Kernel
        id: build
        uses: ./.github/actions/build-kernel
        with:
          op_config_json: ${{ steps.prepare_config.outputs.config_json }}
          ksu_type: KSUN
          ksu_branch_or_hash: ${{ matrix.ksu_resolved_hash }}
          susfs_commit_hash_or_branch: ${{ matrix.susfs_resolved_hash }}
          optimize_level: ${{ inputs.optimize_level }}
          clean: ${{ inputs.clean_build }}
          debug: ${{ inputs.debug }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build summary
        if: always()
        run: |
          {
            echo ""
            echo "### ${{ matrix.model }} (${{ matrix.os_version }}) — ${{ job.status == 'success' && '✅ 成功' || '❌ 失败' }}"
            echo ""
            echo "| 项目 | 值 |"
            echo "|------|-----|"
            echo "| 内核 | ${{ matrix.android_version }}-${{ matrix.kernel_version }} |"
            echo "| KernelSU-Next | ${{ steps.build.outputs.ksu_version }} |"
            echo "| 产物 | \`${{ steps.build.outputs.zip_name }}\` |"
            echo "| 耗时 | ${{ steps.build.outputs.build_time }}s |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # Job 3: 可选 —— 创建 Release
  # ===========================================================================
  release:
    name: Create release
    needs: [resolve, build]
    if: ${{ !cancelled() && inputs.make_release && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all AK3 artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./ak3
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="op-ksun-$(date -u +%Y%m%d-%H%M%S)"
          COUNT=$(find ./ak3 -maxdepth 1 -name '*.zip' | wc -l)
          echo "共 $COUNT 个 AK3 包"
          find ./ak3 -maxdepth 1 -name '*.zip' -printf '%f  (%s bytes)\n' | sort

          {
            echo "# OnePlus KernelSU-Next 构建"
            echo ""
            echo "**触发参数**：device=\`${{ inputs.device }}\` / android=\`${{ inputs.android_version }}\` / ksu_ref=\`${{ inputs.ksu_ref }}\` / optimize=\`${{ inputs.optimize_level }}\`"
            echo ""
            echo "**产物数量**：$COUNT"
            echo ""
            echo "| 文件 |"
            echo "|------|"
            find ./ak3 -maxdepth 1 -name '*.zip' -printf '| `%f` |\n' | sort
          } > release_notes.md

          gh release create "$TAG" \
            --title "OnePlus KernelSU-Next (${{ inputs.device }}) $TAG" \
            --notes-file release_notes.md \
            ./ak3/*.zip
