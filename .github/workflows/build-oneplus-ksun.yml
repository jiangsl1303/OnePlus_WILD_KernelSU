####################################################################################
#  一键构建「指定一加设备」的 KernelSU-Next 版 GKI 内核 AK3 刷机包
#
#  用法：
#    1. Fork https://github.com/WildKernels/OnePlus_KernelSU_SUSFS
#    2. 把本文件放到 fork 仓库的 .github/workflows/ 目录下
#    3. Actions → Build OnePlus Kernel (KernelSU-Next + SUSFS) → Run workflow
#    4. 在 device 输入框里填型号关键字（OP13 / OP13,OP12 / oneplus_13 / 13 / all）
#
#  特点：
#    - 每次运行都从上游拉取最新的 configs/ 与 manifests/，永远构建最新内核源码
#    - 支持精确到单一机型，也支持一次构建全部机型
#    - 复用上游 build-kernel action（编译 / 打包 AK3 / 上传产物 / ccache 缓存全自动）
#    - 产物直接是 AnyKernel3 zip，可在 KernelSU Manager 或 TWRP 里直接刷入
####################################################################################

name: Build OnePlus Kernel (KernelSU-Next + SUSFS)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      device:
        description: >-
          设备选择：all = 全部设备；或型号关键字（逗号分隔可多选）。
          例：OP13 / OP13,OP12 / oneplus_13 / 13 / ace5 / pad3
        required: true
        type: string
        default: 'all'

      android_version:
        description: 'Android 大版本过滤（auto = 不限，构建该设备所有版本）'
        required: true
        type: choice
        options:
          - auto
          - A14
          - A15
          - A16
        default: 'auto'

      susfs_mode:
        description: >-
          SUSFS 方案：source = 最新 KernelSU-Next SUSFS 集成分支 + 最新 SUSFS 源码补丁，
          直接编进内核；lkm = 最新官方 KernelSU-Next + 可加载 SUSFS 模块；
          patched = 传统源码补丁方案（SUSFS v2.2.0 + KSUN 33239 成对钉定）；
          none = 只带 KernelSU-Next，完全不带 SUSFS。
        required: true
        type: choice
        options:
          - source
          - lkm
          - patched
          - none
        default: 'source'

      fetch_manager:
        description: '顺带抓取与内核版本号最接近的官方 KernelSU-Next 管理器 APK（普通版 + spoof 版）。暂不建议开：版本挑选逻辑还没校准'
        required: false
        type: boolean
        default: false

      ksu_ref:
        description: >-
          KernelSU-Next 分支或 commit。auto(默认) = source 使用 pershoot/KernelSU-Next
          的 dev-susfs 最新提交（内核已集成 SUSFS），lkm/none 使用官方 dev 最新提交，
          patched 使用 234f6e04（= KSUN 33239）。也可直接填分支名或 commit。
        required: true
        type: string
        default: 'auto'

      susfs_ref:
        description: >-
          SUSFS 源码引用。source 默认跟随对应 gki-* 分支头，获取最新源码补丁；
          patched 默认使用已验证的 v2.2.0 配对提交；latest、分支名或 commit 可覆盖。
        required: true
        type: string
        default: 'auto'

      optimize_level:
        description: '编译优化等级'
        required: true
        type: choice
        options:
          - O2
          - O3
        default: 'O2'

      clean_build:
        description: '禁用 ccache 缓存（clean build，更慢但更干净）'
        required: false
        type: boolean
        default: false

      make_release:
        description: '构建成功后创建 Release（方便长期保存和分享）'
        required: false
        type: boolean
        default: false

      list_only:
        description: '只列出匹配到的设备，不执行构建（用来查设备关键字）'
        required: false
        type: boolean
        default: false

      only_lkm:
        description: '只打包 SUSFS LKM 模块，跳过全部内核构建（用来单独更新模块，约 2 分钟）'
        required: false
        type: boolean
        default: false

      debug:
        description: '输出详细调试日志'
        required: false
        type: boolean
        default: false

concurrency:
  group: oneplus-ksun-${{ github.ref }}-${{ inputs.device }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # Job 1: 解析设备选择 → 生成构建矩阵
  # ===========================================================================
  resolve:
    name: Resolve devices
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      count: ${{ steps.gen.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sync latest configs & manifests from upstream
        run: |
          set -euo pipefail
          echo "::group::Sync upstream"
          curl -fsSL --retry 3 --retry-delay 5 -o upstream.tar.gz \
            "https://codeload.github.com/WildKernels/OnePlus_KernelSU_SUSFS/tar.gz/refs/heads/main"
          tar xzf upstream.tar.gz
          rm -rf configs manifests
          cp -r OnePlus_KernelSU_SUSFS-main/configs ./configs
          cp -r OnePlus_KernelSU_SUSFS-main/manifests ./manifests
          rm -rf OnePlus_KernelSU_SUSFS-main upstream.tar.gz
          echo "config files : $(find configs -name '*.json' | wc -l)"
          echo "manifest files: $(find manifests -name '*.xml' | wc -l)"
          echo "::endgroup::"

      - name: Generate build matrix
        id: gen
        shell: bash
        env:
          DEVICE_INPUT: ${{ inputs.device }}
          AV_INPUT: ${{ inputs.android_version }}
          KSU_REF: ${{ inputs.ksu_ref }}
          SUSFS_REF: ${{ inputs.susfs_ref }}
          SUSFS_MODE: ${{ inputs.susfs_mode }}
        run: |
          set -euo pipefail
          echo "::group::Generate matrix"

          shopt -s nullglob
          files=(configs/*/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::上游 configs 为空，同步失败。"
            exit 1
          fi

          # 1) 汇总全部设备配置
          jq -s '.' "${files[@]}" > /tmp/all_configs.json

          # 2) Android 版本过滤
          if [ "$AV_INPUT" != "auto" ]; then
            jq -c --arg av "$AV_INPUT" 'map(select(.os_version == $av))' \
              /tmp/all_configs.json > /tmp/stage1.json
          else
            jq -c '.' /tmp/all_configs.json > /tmp/stage1.json
          fi

          total_av=$(jq 'length' /tmp/stage1.json)
          if [ "$total_av" -eq 0 ]; then
            echo "::error::在 Android 版本 '$AV_INPUT' 下没有任何设备配置。"
            exit 1
          fi

          # 3) 设备关键字过滤
          #    匹配优先级：精确 model → model 前缀 → model/manifest 包含
          device_lc=$(echo "$DEVICE_INPUT" | tr '[:upper:]' '[:lower:]' | xargs)

          if [ "$device_lc" = "all" ] || [ "$device_lc" = "*" ] || [ -z "$device_lc" ]; then
            cp /tmp/stage1.json /tmp/stage2.json
          else
            echo '[]' > /tmp/stage2.json
            IFS=',' read -ra tokens <<< "$device_lc"
            for raw_token in "${tokens[@]}"; do
              token=$(echo "$raw_token" | xargs)
              [ -z "$token" ] && continue

              # 1) 型号名「边界前缀」匹配：
              #    OP13 → 命中 OP13 / OP13-6.6.30 / OP13-CPH，但不会误命中 OP13T / OP13S
              hit=$(jq -c --arg t "$token" \
                '[.[] | select((.model | ascii_downcase) as $m
                   | ($m == $t)
                     or ($m | startswith($t + "-"))
                     or ($m | startswith($t + "_"))
                     or ($m | startswith($t + ".")))]' /tmp/stage1.json)
              # 2) manifest 文件名边界前缀匹配：
              #    oneplus_13 → oneplus_13_6.6.30_v.xml，但不会命中 oneplus_13t_*
              if [ "$(echo "$hit" | jq 'length')" -eq 0 ]; then
                hit=$(jq -c --arg t "$token" \
                  '[.[] | select((.manifest | ascii_downcase) as $f
                     | ($f == $t)
                       or ($f | startswith($t + "_"))
                       or ($f | startswith($t + "-"))
                       or ($f | startswith($t + ".")))]' /tmp/stage1.json)
              fi
              # 3) 归一化前缀匹配（忽略 - _ . 分隔符）：
              #    pad3 → OP-PAD-3-*   /   ace5pro → OP-ACE-5-PRO*   /   13 → OP13*
              if [ "$(echo "$hit" | jq 'length')" -eq 0 ]; then
                token_norm=$(echo "$token" | sed 's/[._-]//g')
                hit=$(jq -c --arg t "$token_norm" \
                  'def norm: ascii_downcase | gsub("[._-]"; "");
                   [.[] | select((.model | norm) as $m
                      | ($m | startswith($t)) or ($m | startswith("op" + $t)))]' \
                  /tmp/stage1.json)
              fi
              # 4) 最终兜底：归一化后的包含匹配
              if [ "$(echo "$hit" | jq 'length')" -eq 0 ]; then
                token_norm=$(echo "$token" | sed 's/[._-]//g')
                hit=$(jq -c --arg t "$token_norm" \
                  'def norm: ascii_downcase | gsub("[._-]"; "");
                   [.[] | select(((.model | norm) | contains($t))
                      or ((.manifest | norm) | contains($t)))]' \
                  /tmp/stage1.json)
              fi

              n=$(echo "$hit" | jq 'length')
              if [ "$n" -eq 0 ]; then
                echo "::warning::关键字 '$token' 没有匹配到任何设备，已跳过。"
              else
                echo "关键字 '$token' 匹配到 $n 个配置。"
              fi
              jq -n --argjson a "$(cat /tmp/stage2.json)" --argjson b "$hit" '$a + $b' > /tmp/stage2.tmp
              mv /tmp/stage2.tmp /tmp/stage2.json
            done
            # 去重（同 model + 同 os_version 只保留一条）
            jq -c 'unique_by(.model + "|" + .os_version)' /tmp/stage2.json > /tmp/stage2.dedup
            mv /tmp/stage2.dedup /tmp/stage2.json
          fi

          count=$(jq 'length' /tmp/stage2.json)
          if [ "$count" -eq 0 ]; then
            echo "::error::没有匹配到任何设备。可用的设备关键字示例："
            jq -r '.[] | "  - \(.model)  [\(.os_version)]  (\(.android_version)-\(.kernel_version))"' \
              /tmp/all_configs.json | head -40
            exit 1
          fi

          echo "共匹配到 $count 个设备配置。"

          # 4) 解析 KernelSU-Next 的 commit 与仓库。
          # source 使用 pershoot 的 dev-susfs：该分支把 SUSFS 集成在 KSUN 内核树中，
          # 可与最新 SUSFS GKI 源码补丁同步；其管理器仍从官方仓库单独获取。
          KSU_PIN_33239="234f6e040fcbca18b16d2398e1aa225712ec99ad"
          KSU_OFFICIAL_REPO="https://github.com/KernelSU-Next/KernelSU-Next.git"
          KSU_SOURCE_REPO="https://github.com/pershoot/KernelSU-Next.git"
          if [ "$SUSFS_MODE" = "source" ] && { [ "$KSU_REF" = "auto" ] || [ -z "$KSU_REF" ]; }; then
            KSU_REF="dev-susfs"
            KSU_REPO="$KSU_SOURCE_REPO"
          elif [ "$KSU_REF" = "auto" ] || [ -z "$KSU_REF" ]; then
            case "$SUSFS_MODE" in
              patched) KSU_REF="$KSU_PIN_33239" ;;
              *)       KSU_REF="dev" ;;
            esac
            KSU_REPO="$KSU_OFFICIAL_REPO"
          else
            KSU_REPO="$KSU_OFFICIAL_REPO"
          fi

          echo "ksu_ref=$KSU_REF, ksu_repo=$KSU_REPO"
          echo "解析 KernelSU-Next ref: $KSU_REF ..."
          ksu_resolved=""
          ksu_api_repo="KernelSU-Next/KernelSU-Next"
          [ "$KSU_REPO" = "$KSU_SOURCE_REPO" ] && ksu_api_repo="pershoot/KernelSU-Next"
          for i in 1 2 3; do
            ksu_resolved=$(curl -fsSL --retry 2 \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${ksu_api_repo}/commits/${KSU_REF}" \
              2>/dev/null | jq -r '.sha // empty' || true)
            [ -n "$ksu_resolved" ] && break
            echo "  第 $i 次解析失败，重试..."
            sleep 5
          done
          if [ -z "$ksu_resolved" ]; then
            echo "::error::无法解析 KernelSU-Next 的 '$KSU_REF' from $KSU_REPO"
            exit 1
          fi
          echo "KernelSU-Next → $ksu_resolved ($KSU_REPO)"

          # 4.1) 提示：源码补丁模式下 KernelSU-Next 版本必须与 SUSFS 修复补丁集匹配
          #      上游 kernel_patches 的 v2.2.0 修复补丁是按 KSUN 33239 生成的
          #      （见其提交信息 “Update KSUN 33239 SusFS 2.2.0 + KSU_Toolkit”）。
          #      KernelSU-Next 更新后，10_enable_susfs_for_ksu.patch 会产生新的 .rej 文件，
          #      而对应 fix_*.patch 不存在，导致构建报
          #      “fix_xxx.patch: No such file or directory” 而失败。
          #      lkm / none 模式不打 SUSFS 源码补丁，因此不受此约束。
          if [ "$SUSFS_MODE" = "patched" ]; then
            case "$KSU_REF" in
              dev|latest|main|next|HEAD|master)
                if [ "${SUSFS_REF:-auto}" != "latest" ]; then
                  echo "::warning::ksu_ref=$KSU_REF 是滚动分支，版本可能已超过 KSUN 33239；SUSFS v2.2.0 修复补丁只适配到 33239。若构建失败，请改用默认值 $KSU_PIN_33239，或把 susfs_mode 换成 lkm。"
                fi
                ;;
            esac
          fi

          # 5) 解析每个内核版本对应的 SUSFS 引用
          #
          #    背景：这是一组「必须成对」的版本。
          #    · 上游 WildKernels/kernel_patches 的 next/susfs_fix_patches 只提供到 v2.2.0，
          #      且其 v2.2.0 目录是按 KSUN 33239 生成的
          #      （提交信息：“Update KSUN 33239 SusFS 2.2.0 + KSU_Toolkit”，2026-08-11）。
          #    · susfs4ksu 各 gki-* 分支已于 2026-08-30 升到 v2.3.0，取分支头会直接报
          #      “Unsupported SUSFS version: v2.3.0”。
          #    · SUSFS 太新或 KSU 太新，10_enable_susfs_for_ksu.patch 都会在更多文件上产生
          #      .rej，而对应 fix_*.patch 不存在 → 构建报
          #      “fix_xxx.patch: No such file or directory” 而失败。
          #
          #    所以两边一起钉：
          #      SUSFS = 各分支在 2026-08-11（kernel_patches v2.2.0 最后一次更新）时的提交
          #      KSU   = 234f6e04（该日期的 dev HEAD，版本号 33239）
          #    已用 `patch -p1 --forward` 实测：7 个分支产生的 .rej 恰好等于
          #    {Kbuild, init.c, kernel_umount.c, setuid_hook.c, sucompat.c, supercall.c}，
          #    与 v2.2.0 目录下的 6 个 fix_*.patch 一一对应。
          #
          #    上游补齐 v2.3.0 修复补丁后，把 susfs_ref 设为 latest 并把 ksu_ref 改回 dev。
          #
          #    注意：这里刻意用 12 位短 SHA。gitlab.com 的 WAF 会对 URL 路径里
          #    完整的 40 位十六进制串直接返回 403（Cloudflare 挑战页），短 SHA 不受影响，
          #    而 GitLab 的 /-/archive/<ref>/ 与 /-/raw/<ref>/ 都能正常解析短 SHA。
          declare -A SUSFS_V220=(
            ["android12-5.10"]="3c14ad549f82"
            ["android13-5.10"]="f81aaf10e956"
            ["android13-5.15"]="ccb1918684b2"
            ["android14-5.15"]="0463ac089308"
            ["android14-6.1"]="e287d5906638"
            ["android15-6.6"]="be7b7ef49a1e"
            ["android16-6.12"]="f37930f374ef"
          )

          # action.yml 的 case 分支能识别的版本集合
          susfs_supported() {
            case "$1" in
              v1.5.8|v1.5.9|v1.5.10|v1.5.11|v1.5.12|v2.0.0|v2.1.0|v2.2.0) return 0 ;;
              *) return 1 ;;
            esac
          }

          # 读取某个 ref 的 susfs.h 中声明的版本号（纯 bash 解析，避免管道 SIGPIPE 噪音）
          susfs_version_of() {
            local body
            body=$(curl -fsSL --retry 2 --retry-delay 3 --max-time 40 \
              "https://gitlab.com/simonpunk/susfs4ksu/-/raw/$1/kernel_patches/include/linux/susfs.h" \
              2>/dev/null || true)
            body=${body//$'\r'/}
            if [[ $body =~ \#define\ SUSFS_VERSION\ \"([^\"]*)\" ]]; then
              printf '%s' "${BASH_REMATCH[1]}"
            fi
          }

          declare -A susfs_map
          case "$SUSFS_MODE" in
            patched|source)
              mapfile -t active_keys < <(
                jq -r '[.[] | select(.susfs == true) | "\(.android_version)-\(.kernel_version)"] | unique | .[]' \
                  /tmp/stage2.json | tr -d '\r'
              )
              ;;
            *)
              active_keys=()
              echo "susfs_mode=$SUSFS_MODE → 内核不打任何 SUSFS 源码补丁，全部设备按 susfs=false 构建。"
              ;;
          esac
          for key in "${active_keys[@]}"; do
            branch="gki-${key}"
            sha=""
            if [ "$SUSFS_MODE" = "source" ]; then
              # source 模式：SUSFS v2.3.0 源码补丁直接编进内核。
              # 补丁链在仓库 .github/patches/susfs-v23/，action.yml 已加 "v2.3.0" case。
              # 默认跟随分支头（当前 v2.3.0）；也可用 susfs_ref 钉到指定 commit/分支。
              case "${SUSFS_REF:-auto}" in
                ''|auto|latest|branch|head|pinned)
                  sha="$branch"
                  ver=$(susfs_version_of "$sha")
                  echo "SUSFS [$key] → 分支头 $branch${ver:+, 版本 $ver}（源码补丁模式，编进内核）"
                  ;;
                *)
                  sha="$SUSFS_REF"
                  ver=$(susfs_version_of "$sha")
                  echo "SUSFS [$key] → 用户指定 $sha${ver:+, 版本 $ver}（源码补丁模式）"
                  ;;
              esac
              susfs_map["$key"]="$sha"
              continue
            fi
            case "${SUSFS_REF:-auto}" in
              ''|auto|pinned)
                sha="${SUSFS_V220[$key]:-}"
                if [ -n "$sha" ]; then
                  ver=$(susfs_version_of "$sha")
                  if [ -n "$ver" ] && ! susfs_supported "$ver"; then
                    echo "::warning::SUSFS [$key] 钉定提交 $sha 报告 $ver，不在 action 支持列表内。"
                  fi
                  echo "SUSFS [$key] → 钉定 ${sha:0:12} (配对提交${ver:+, 实测 $ver})"
                else
                  echo "::warning::SUSFS [$key] 无内置钉定值，回退分支头 $branch。"
                  sha="$branch"
                fi
                ;;
              latest|branch|head)
                sha="$branch"
                ver=$(susfs_version_of "$sha")
                if [ -n "$ver" ] && ! susfs_supported "$ver"; then
                  sha="${SUSFS_V220[$key]:-$branch}"
                  echo "::warning::SUSFS [$key] 分支头 $branch 报告 $ver，上游 action 尚不支持；已回退钉定值 ${sha}。"
                fi
                echo "SUSFS [$key] → $sha${ver:+, 分支头版本 $ver}"
                ;;
              *)
                sha="$SUSFS_REF"
                echo "SUSFS [$key] → 用户指定 $sha"
                ;;
            esac
            susfs_map["$key"]="$sha"
          done

          # 6) 注入 ksu / susfs 字段，生成最终 matrix
          #    lkm / none：强制 susfs=false，action 的 “Apply SUSFS Patches” 步骤会被整体跳过
          #    patched / source：保留 susfs=true，走 action 的源码补丁流程
          if [ "$SUSFS_MODE" = "lkm" ] || [ "$SUSFS_MODE" = "none" ]; then
            jq -c --arg kh "$ksu_resolved" --arg kr "$KSU_REF" --arg repo "$KSU_REPO" \
              'map(. + {ksu_type: "KSUN", ksu_hash: $kr, ksu_resolved_hash: $kh,
                        ksu_repo: $repo, susfs: false, susfs_resolved_hash: ""})' \
              /tmp/stage2.json > /tmp/final.json
          else
            jq -c --arg kh "$ksu_resolved" --arg kr "$KSU_REF" --arg repo "$KSU_REPO" \
              'map(. + {ksu_type: "KSUN", ksu_hash: $kr, ksu_resolved_hash: $kh,
                        ksu_repo: $repo})' \
              /tmp/stage2.json > /tmp/final.json
          fi

          for key in "${!susfs_map[@]}"; do
            jq -c --arg k "$key" --arg s "${susfs_map[$key]}" \
              'map(if (.android_version + "-" + .kernel_version) == $k
                   then . + {susfs_resolved_hash: $s} else . end)' \
              /tmp/final.json > /tmp/final.tmp
            mv /tmp/final.tmp /tmp/final.json
          done

          jq -c '{include: .}' /tmp/final.json > /tmp/matrix.json
          matrix_json=$(cat /tmp/matrix.json)

          # 本次运行涉及的 KMI 列表（如 android14-6.1），供 LKM 打包 job 使用
          kmi_list=$(jq -r '[.[] | "\(.android_version)-\(.kernel_version)"] | unique | join(",")' /tmp/final.json)

          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "kmi_list=$kmi_list" >> "$GITHUB_OUTPUT"
          # KernelSU-Next 版本号 = 该 commit 的提交总数 + 30000（与 Kbuild 里的算法一致），
          # 供 manager job 去官方 release 里挑版本号最接近的管理器 APK。
          # 注意：这里必须用 GET + -D 取响应头，不能用 -I（HEAD）—— GitHub API 对
          # HEAD 请求不返回 Link 头，会导致版本号算成 30000 进而选错 release。
          ksuver_pages=$(curl -s -D - -o /dev/null --retry 2 \
            "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/commits?sha=${ksu_resolved}&per_page=1" \
            | tr -d '\r' | grep -i '^link:' | grep -o 'page=[0-9]*>; rel="last"' \
            | grep -o '[0-9][0-9]*' | head -1 || true)
          ksuver=$(( ${ksuver_pages:-0} + 30000 ))
          echo "ksuver=$ksuver" >> "$GITHUB_OUTPUT"
          echo "KernelSU-Next 版本号: $ksuver（commit 数 ${ksuver_pages:-0}）"
          {
            echo "matrix<<MATRIX_EOF"
            echo "$matrix_json"
            echo "MATRIX_EOF"
          } >> "$GITHUB_OUTPUT"

          # 7) 写入 Job Summary，方便核对
          {
            echo "## 将要构建的设备（$count 个）"
            echo ""
            echo "| 型号 | OS | 内核 | SoC | 分支 | KSU | SUSFS |"
            echo "|------|----|------|-----|------|-----|-------|"
            jq -r '.[] | "| \(.model) | \(.os_version) | \(.android_version)-\(.kernel_version) | \(.soc) | \(.branch) | KSUN | `\(.susfs_resolved_hash)` |"' /tmp/final.json
            echo ""
            case "$SUSFS_MODE" in
              source)
                echo "> **源码集成模式**：内核使用 pershoot/KernelSU-Next 的最新 dev-susfs 提交（\`$ksu_resolved\`，版本号 $ksuver），"
                echo "> SUSFS 集成在 KSUN 内核树中，并同步使用对应 gki-* 分支的最新 SUSFS 源码补丁（\`${KSU_REPO}\`）。"
                echo "> 该路径不再应用针对旧 KSUN 目录结构的本地 108KB 补丁链。"
                ;;
              patched)
                echo "> **源码补丁模式（钉定组合）**：SUSFS 与 KernelSU-Next 是**成对钉定**的 —— SUSFS 取各分支 2026-08-11 的提交，"
                echo "> KSU 取 234f6e04（KSUN 33239），与上游 \`kernel_patches\` 的 v2.2.0 修复补丁严格对应。"
                echo "> 上游补出 v2.3.0 补丁后，把 \`susfs_ref\` 设为 \`latest\`、\`ksu_ref\` 改回 \`dev\` 即可。"
                ;;
              lkm)
                echo "> **LKM 模式**：内核使用最新 KernelSU-Next（\`$ksu_resolved\`），**不打任何 SUSFS 源码补丁**；"
                echo "> SUSFS 由额外产出的 \`SUSFS-LKM-*.zip\` 提供（SUSFS v2.3.0 可加载内核模块，经 KernelSU \`ksud insmod\` 加载）。"
                echo "> 刷入顺序：先刷 AK3 内核包并重启 → 再在 KernelSU 管理器里安装 LKM 模块 zip → 再重启。"
                echo "> 涉及的 KMI：\`$kmi_list\`"
                ;;
              none)
                echo "> **无 SUSFS 模式**：只构建带 KernelSU-Next（\`$ksu_resolved\`）的内核，不打任何 SUSFS 补丁。"
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::endgroup::"

  # ===========================================================================
  # Job 2: 并行构建
  # ===========================================================================
  build:
    name: build (${{ matrix.model }} / ${{ matrix.os_version }} / KSUN)
    needs: resolve
    if: ${{ needs.resolve.result == 'success' && !inputs.list_only && !inputs.only_lkm }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # build-kernel action 会从 ../manifests/<os_version>/ 读取 manifest，必须在 workspace 根准备好
      - name: Sync latest configs & manifests from upstream
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 -o upstream.tar.gz \
            "https://codeload.github.com/WildKernels/OnePlus_KernelSU_SUSFS/tar.gz/refs/heads/main"
          tar xzf upstream.tar.gz
          rm -rf configs manifests
          cp -r OnePlus_KernelSU_SUSFS-main/configs ./configs
          cp -r OnePlus_KernelSU_SUSFS-main/manifests ./manifests
          rm -rf OnePlus_KernelSU_SUSFS-main upstream.tar.gz

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential clang lld flex bison \
            libelf-dev libssl-dev libncurses-dev zlib1g-dev liblz4-tool \
            libxml2-utils rsync unzip dwarves file python3 python3-requests \
            ccache jq bc dos2unix kmod libdw-dev elfutils pigz aria2
          sudo apt-get clean

      - name: Configure ccache
        if: ${{ !inputs.clean_build }}
        run: |
          set -euo pipefail
          if ! command -v ccache >/dev/null 2>&1; then
            echo "ccache 不可用，跳过配置"
            exit 0
          fi
          CACHE_DIR="${GITHUB_WORKSPACE}/.ccache"
          CCACHE_LOG="${GITHUB_WORKSPACE}/ccache.log"
          mkdir -p "$CACHE_DIR"
          cat >> "$GITHUB_ENV" <<EOF
          CCACHE_DIR=${CACHE_DIR}
          CCACHE_MAXSIZE=12G
          CCACHE_COMPILERCHECK=content
          CCACHE_BASEDIR=${GITHUB_WORKSPACE}
          CCACHE_NOHASHDIR=true
          CCACHE_IGNOREOPTIONS=--sysroot*
          CCACHE_COMPRESSION=true
          CCACHE_COMPRESSION_LEVEL=3
          CCACHE_DIRECT=true
          CCACHE_FILE_CLONE=true
          CCACHE_INODE_CACHE=true
          CCACHE_IS_KERNEL_COMPILING=true
          CCACHE_UMASK=002
          CCACHE_LOGFILE=${CCACHE_LOG}
          CCACHE_SLOPPINESS=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,system_headers,locale
          EOF
          ccache --version | head -1

      - name: Prepare op_config_json
        id: prepare_config
        shell: bash
        run: |
          echo "config_json=$(jq -nc --argjson m '${{ toJSON(matrix) }}' \
            '$m | del(.ksu_type, .ksu_hash, .ksu_resolved_hash, .ksu_repo, .susfs_resolved_hash)')" >> "$GITHUB_OUTPUT"

      - name: Build Kernel
        id: build
        uses: ./.github/actions/build-kernel
        with:
          op_config_json: ${{ steps.prepare_config.outputs.config_json }}
          ksu_type: KSUN
          ksu_branch_or_hash: ${{ matrix.ksu_resolved_hash }}
          ksu_repo: ${{ matrix.ksu_repo }}
          susfs_commit_hash_or_branch: ${{ matrix.susfs_resolved_hash }}
          optimize_level: ${{ inputs.optimize_level }}
          clean: ${{ inputs.clean_build }}
          debug: ${{ inputs.debug }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build summary
        if: always()
        run: |
          {
            echo ""
            echo "### ${{ matrix.model }} (${{ matrix.os_version }}) — ${{ job.status == 'success' && '✅ 成功' || '❌ 失败' }}"
            echo ""
            echo "| 项目 | 值 |"
            echo "|------|-----|"
            echo "| 内核 | ${{ matrix.android_version }}-${{ matrix.kernel_version }} |"
            echo "| KernelSU-Next | ${{ steps.build.outputs.ksu_version }} |"
            echo "| 产物 | \`${{ steps.build.outputs.zip_name }}\` |"
            echo "| 耗时 | ${{ steps.build.outputs.build_time }}s |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # Job 2.5: 打包 SUSFS LKM 内核模块（susfs_mode=lkm 时）
  #
  #   SUSFS v2.3.0 以「可加载内核模块（.ko）」形式提供，由 KernelSU 的 ksud/loader
  #   在开机 post-fs-data 阶段加载。因此内核侧完全不需要打 SUSFS 源码补丁 ——
  #   这就是「最新内核 + 新 SUSFS」的解法，绕开了 kernel_patches 只到 v2.2.0 的限制。
  #
  #   产物是一个 KernelSU 模块 zip（不是 AK3 刷机包）：
  #     1. 先刷 AK3 内核包并重启
  #     2. 在 KernelSU 管理器里安装本模块 zip 并重启
  # ===========================================================================
  lkm:
    name: Package SUSFS LKM
    needs: resolve
    if: ${{ needs.resolve.result == 'success' && (inputs.susfs_mode == 'lkm' || inputs.only_lkm) }}
    runs-on: ubuntu-latest
    outputs:
      lkm_zip: ${{ steps.assemble.outputs.lkm_zip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download pinned LKM assets
        shell: bash
        env:
          LKM_REPO: inforcqb/susfs4ksu-lkm
          LKM_TAG: v2.3.0-r18
        run: |
          set -euo pipefail
          echo "::group::Download $LKM_REPO $LKM_TAG"
          mkdir -p build/lib build/bin
          BASE="https://github.com/${LKM_REPO}/releases/download/${LKM_TAG}"

          # 文件名 | SHA-256（取自上游 release 的 asset digest，全部逐一下载后校验）
          cat > /tmp/assets.txt <<'EOF'
          susfs_guard_lkm-android12-5.10.ko|2919828c6322a93f54240abb6e088906719f39a7d90d90a5446ba6cef1d18b62
          susfs_guard_lkm-android13-5.10.ko|83335a3a0cf416e1e0088b5618f81798806cff163e6cdcc77c82187bb436796e
          susfs_guard_lkm-android13-5.15.ko|51e1a7bfe138e48c43aea1007959ad8b3a89d7f0273e1cd71d15ddfbf92a996a
          susfs_guard_lkm-android14-5.15.ko|938f1ab237880f71a23605345feb5125a02a21760852d719fd4c973cd6778a4d
          susfs_guard_lkm-android14-6.1.ko|348223dad43bb7282769a8908228001bf6f6ae69deab3594b8265247a533d004
          susfs_guard_lkm-android15-6.6.ko|83d580007d727bcff584ae82abd5a3e33acad58f46245738946c9fcbb52993ac
          susfs_guard_lkm-android16-6.12.ko|c108e630882c9d99b2a61f0419626477ae65ccf427d4e53ed327f4259b460edf
          susfs_guard_lkm-android17-6.18.ko|42072deda243ce7ee7a1f0979339cd553464cd52a4a49697f9e7b3937c167875
          susfs_insmod|2c23e2259d5ad4d324add01caa6e0d9a03d0e34ee7f112237176568d12630608
          EOF

          total=0
          while IFS='|' read -r name sha; do
            [ -z "${name:-}" ] && continue
            case "$name" in
              *.ko) dest="build/lib/$name" ;;
              *)    dest="build/bin/$name" ;;
            esac
            ok=0
            for attempt in 1 2 3; do
              if curl -fsSL --retry 3 --retry-all-errors --max-time 300 -o "$dest" "$BASE/$name"; then ok=1; break; fi
              echo "  第 $attempt 次下载 $name 失败，重试..."
              sleep 5
            done
            [ "$ok" = 1 ] || { echo "::error::无法下载 $name"; exit 1; }
            got=$(sha256sum "$dest" | awk '{print $1}')
            if [ "$got" != "$sha" ]; then
              echo "::error::SHA-256 校验失败: $name 期望 $sha 实际 $got"
              exit 1
            fi
            chmod 0755 "$dest"
            sz=$(stat -c%s "$dest")
            total=$((total + sz))
            echo "  ✅ $name  ${sz} bytes  sha256=${got:0:16}…"
          done < /tmp/assets.txt

          echo "共 $(ls build/lib/*.ko | wc -l) 个 .ko + loader，合计 $((total / 1048576)) MB"
          echo "LKM_TAG=${LKM_TAG}" >> "$GITHUB_ENV"
          echo "::endgroup::"

      - name: Compile SUSFS absence probe (arm64, NDK)
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Build susfs_probe"
          cat > build/susfs_probe.c <<'EOF'
          // SPDX-License-Identifier: GPL-2.0-only
          // Independent read-only wire probe. Existing/unknown implementations are never stacked.
          // 来源：https://github.com/matsuzaka-yuki/susfs-lkm-module (tools/susfs_probe.c, GPL-2.0-only)
          #include <errno.h>
          #include <stdio.h>
          #include <string.h>
          #include <sys/syscall.h>
          #include <unistd.h>

          struct text_reply { char text[16]; int err; };

          int main(void)
          {
              if (geteuid() != 0) return 12;
              const unsigned commands[] = {0x555e1, 0x555e3};
              for (unsigned i = 0; i < sizeof(commands) / sizeof(commands[0]); ++i) {
                  struct text_reply reply = { .text = {0}, .err = 126 };
                  errno = 0;
                  long result = syscall(SYS_reboot, 0xdeadbeefU, 0xfafafafaU, commands[i], &reply);
                  if (reply.err != 126 || reply.text[0] != '\0') {
                      puts("Existing SUSFS control interface detected (not a compatibility guarantee).");
                      return 0;
                  }
                  if (result == -1 && errno != EINVAL && errno != ENOSYS) return 12;
              }
              puts("No responding SUSFS version/variant interface.");
              return 10;
          }
          EOF

          # 找 NDK
          NDK=""
          for cand in "${ANDROID_NDK_HOME:-}" "${ANDROID_NDK_ROOT:-}" "${ANDROID_NDK:-}"; do
            [ -n "$cand" ] && [ -d "$cand" ] && { NDK="$cand"; break; }
          done
          if [ -z "$NDK" ]; then
            for base in "${ANDROID_HOME:-/usr/local/lib/android/sdk}" /usr/local/lib/android/sdk; do
              [ -d "$base/ndk" ] || continue
              NDK=$(find "$base/ndk" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
              [ -n "$NDK" ] && break
            done
          fi

          if [ -n "$NDK" ] && [ -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang" ]; then
            echo "使用 NDK: $NDK"
            "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang" \
              -O2 -Wall -Wextra -fPIE -pie build/susfs_probe.c -o build/bin/susfs_probe
            chmod 0755 build/bin/susfs_probe
            file build/bin/susfs_probe
            echo "PROBE_OK=1" >> "$GITHUB_ENV"
          else
            echo "::warning::未找到 NDK，退化为 shell 版探测（只查 /proc 节点，可靠性略低）"
            cat > build/bin/susfs_probe <<'EOF'
          #!/system/bin/sh
          # 退化探测：只看 SUSFS 的 /proc 控制节点是否已存在
          for f in /proc/susfs_path /proc/susfs_kstat /proc/susfs_open_redirect \
                   /proc/susfs_hide_mounts /proc/susfs_avc_spoof; do
            [ -e "$f" ] && { echo "Existing SUSFS control interface detected."; exit 0; }
          done
          echo "No responding SUSFS version/variant interface."
          exit 10
          EOF
            chmod 0755 build/bin/susfs_probe
            echo "PROBE_OK=0" >> "$GITHUB_ENV"
          fi
          echo "::endgroup::"

      - name: Assemble KernelSU module zip
        id: assemble
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Assemble module"
          MOD=build/module
          rm -rf "$MOD"
          mkdir -p "$MOD/bin" "$MOD/lib"
          mv build/bin/* "$MOD/bin/"
          mv build/lib/*.ko "$MOD/lib/"

          # ---- module.prop ----
          cat > "$MOD/module.prop" <<'EOF'
          id=susfs_lkm_loader
          name=SUSFS LKM (v2.3.0)
          version=v2.3.0-r18
          versionCode=18
          author=inforcqb (LKM) / matsuzaka-yuki (loader) / packaged by opbuild
          description=SUSFS v2.3.0 as a loadable kernel module, loaded via KernelSU ksud at post-fs-data. Kernel-side SUSFS source patches are NOT required, so it pairs with any KernelSU-Next kernel. Reboot required.
          EOF

          # ---- kmi.sh：按真实 osrelease 选 .ko ----
          cat > "$MOD/kmi.sh" <<'EOF'
          # SPDX-License-Identifier: GPL-2.0-only
          # 按 /proc/sys/kernel/osrelease 的真实值选 KMI（不信任可能已被伪装的 uname）
          select_kmi() {
            case "$1" in
              5.10.*-android12-*) echo android12-5.10 ;;
              5.10.*-android13-*) echo android13-5.10 ;;
              5.15.*-android13-*) echo android13-5.15 ;;
              5.15.*-android14-*) echo android14-5.15 ;;
              6.1.*-android14-*)  echo android14-6.1 ;;
              6.6.*-android15-*)  echo android15-6.6 ;;
              6.12.*-android16-*) echo android16-6.12 ;;
              6.18.*-android17-*) echo android17-6.18 ;;
              *) return 1 ;;
            esac
          }
          EOF

          # ---- customize.sh：安装期只做校验，不加载 ----
          cat > "$MOD/customize.sh" <<'EOF'
          #!/system/bin/sh
          # SPDX-License-Identifier: GPL-2.0-only
          [ "$KSU" = true ] || abort "KernelSU 系管理器才能安装本模块（Magisk 不支持）。"
          [ "$ARCH" = arm64 ] || abort "本模块只打包了 arm64。"
          REAL_KERNEL=$(cat /proc/sys/kernel/osrelease) || abort "读不到 /proc/sys/kernel/osrelease。"
          . "$MODPATH/kmi.sh" || abort "缺少 kmi.sh。"
          KMI=$(select_kmi "$REAL_KERNEL") || abort "不支持的内核 KMI: $REAL_KERNEL"
          [ -s "$MODPATH/lib/susfs_guard_lkm-$KMI.ko" ] || abort "缺少 $KMI 对应的 .ko。"
          chmod 0755 "$MODPATH/post-fs-data.sh" "$MODPATH/bin/susfs_insmod" "$MODPATH/bin/susfs_probe"
          chmod 0644 "$MODPATH/module.prop" "$MODPATH/kmi.sh"
          chmod 0644 "$MODPATH"/lib/*.ko
          touch "$MODPATH/skip_mount"
          ui_print "- 只安装加载器，安装时不加载任何东西。"
          ui_print "- 匹配到的内核 KMI: $KMI (arm64)。厂商 ABI 差异仍可能导致加载失败。"
          ui_print "- 重启后生效；停用/卸载同样重启后生效。"
          ui_print "- 检测到已有 SUSFS 时不会叠加，也不会卸载它。"
          EOF

          # ---- post-fs-data.sh：开机加载 ----
          cat > "$MOD/post-fs-data.sh" <<'EOF'
          #!/system/bin/sh
          # SPDX-License-Identifier: GPL-2.0-only
          MODDIR=${0%/*}
          [ ! -f "$MODDIR/disable" ] && [ ! -f "$MODDIR/remove" ] || exit 0
          umask 077
          exec > "$MODDIR/load.log" 2>&1
          echo "SUSFS LKM loader: $(date)"

          # uname 可能已被别的 SUSFS 实现伪装，这里读真实 release
          REAL_KERNEL=$(cat /proc/sys/kernel/osrelease) || exit 1
          . "$MODDIR/kmi.sh" || { echo "缺少 kmi.sh。"; exit 1; }
          KMI=$(select_kmi "$REAL_KERNEL") || { echo "拒绝不支持的内核: $REAL_KERNEL"; exit 1; }
          LKM="$MODDIR/lib/susfs_guard_lkm-$KMI.ko"
          [ -s "$LKM" ] || { echo "缺少 $KMI 的 .ko。"; exit 1; }
          echo "kernel=$REAL_KERNEL  kmi=$KMI"

          # 1) 先确认当前没有 SUSFS 在跑，避免叠加
          if [ -x "$MODDIR/bin/susfs_probe" ]; then
            "$MODDIR/bin/susfs_probe"
            rc=$?
          else
            echo "探测器缺失，退化查 /proc 节点"
            rc=10
            for f in /proc/susfs_path /proc/susfs_kstat /proc/susfs_open_redirect /proc/susfs_hide_mounts; do
              [ -e "$f" ] && { rc=0; break; }
            done
          fi
          case "$rc" in
            0) echo "检测到已有 SUSFS，保持原样不动。"; exit 0 ;;
            10) ;;
            *) echo "无法确认 SUSFS 不存在（probe=$rc），拒绝加载。"; exit 1 ;;
          esac

          # 2) 加载：优先用上游 loader，退化为 ksud insmod
          if [ -x "$MODDIR/bin/susfs_insmod" ]; then
            "$MODDIR/bin/susfs_insmod" "$LKM" expose_proc=1
            rc=$?
            echo "susfs_insmod 退出码=$rc"
          else
            rc=127
          fi
          if [ "$rc" != 0 ]; then
            if command -v ksud >/dev/null 2>&1; then
              echo "回退到 ksud insmod"
              ksud insmod "$LKM"
              rc=$?
              echo "ksud insmod 退出码=$rc"
            fi
          fi
          [ "$rc" = 0 ] || { echo "加载失败: $rc"; exit "$rc"; }

          # 3) 复检
          if [ -x "$MODDIR/bin/susfs_probe" ]; then
            "$MODDIR/bin/susfs_probe" || { echo "加载返回成功但协议复检失败。"; exit 1; }
          fi
          echo "SUSFS LKM 已加载。本模块不应用任何规则。"
          EOF

          chmod 0755 "$MOD"/customize.sh "$MOD"/post-fs-data.sh "$MOD"/bin/*

          LKM_ZIP="SUSFS-LKM-${LKM_TAG}-arm64-multi-kmi.zip"
          rm -f "$LKM_ZIP"
          ( cd "$MOD" && zip -r -9 "../../$LKM_ZIP" . -x '.*' > /dev/null )
          echo "产物: $LKM_ZIP  $(stat -c%s "$LKM_ZIP") bytes"
          sha256sum "$LKM_ZIP"
          echo "--- 包内清单 ---"
          unzip -l "$LKM_ZIP"
          echo "lkm_zip=$LKM_ZIP" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

      - name: Verify module zip
        shell: bash
        run: |
          set -euo pipefail
          Z="${{ steps.assemble.outputs.lkm_zip }}"
          echo "::group::Verify $Z"
          # module.prop 必须在根
          unzip -l "$Z" | grep -qE '(^| )module\.prop$' || { echo "::error::缺 module.prop"; exit 1; }
          unzip -l "$Z" | grep -qE '(^| )customize\.sh$' || { echo "::error::缺 customize.sh"; exit 1; }
          unzip -l "$Z" | grep -qE '(^| )post-fs-data\.sh$' || { echo "::error::缺 post-fs-data.sh"; exit 1; }
          unzip -l "$Z" | grep -qE '(^| )kmi.sh$' || { echo "::error::缺 kmi.sh"; exit 1; }
          unzip -l "$Z" | grep -qE '(^| )bin/susfs_insmod$' || { echo "::error::缺 bin/susfs_insmod"; exit 1; }
          unzip -l "$Z" | grep -qE '(^| )bin/susfs_probe$' || { echo "::error::缺 bin/susfs_probe"; exit 1; }
          n=$(unzip -l "$Z" | grep -cE 'lib/susfs_guard_lkm-.*\.ko$' || true)
          echo "打包的 .ko 数量: $n"
          [ "$n" -ge 1 ] || { echo "::error::一个 .ko 都没打进去"; exit 1; }
          # 语法自检
          mkdir -p /tmp/modchk && rm -rf /tmp/modchk/* && unzip -q "$Z" -d /tmp/modchk
          sh -n /tmp/modchk/kmi.sh
          sh -n /tmp/modchk/customize.sh
          sh -n /tmp/modchk/post-fs-data.sh
          echo "shell 语法自检通过"
          echo "::endgroup::"

      - name: Upload LKM module
        # 必须用 v7：v4 不支持 archive 输入（会被静默忽略），会把模块 zip 再套一层 zip，
        # 用户从 Artifacts 下载到的是「zip 里装 zip」。
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.assemble.outputs.lkm_zip }}
          path: ${{ steps.assemble.outputs.lkm_zip }}
          archive: false
          compression-level: 0
          retention-days: 90

      - name: Summary
        if: always()
        run: |
          {
            echo ""
            echo "### SUSFS LKM 模块 — ${{ job.status == 'success' && '✅ 已打包' || '❌ 失败' }}"
            echo ""
            echo "| 项目 | 值 |"
            echo "|------|-----|"
            echo "| SUSFS 版本 | v2.3.0（LKM 形式） |"
            echo "| 上游 | \`inforcqb/susfs4ksu-lkm\` @ \`v2.3.0-r18\` |"
            echo "| 产物 | \`${{ steps.assemble.outputs.lkm_zip }}\` |"
            echo "| 覆盖 KMI | 8 个（5.10 / 5.15 / 6.1 / 6.6 / 6.12 / 6.18） |"
            echo ""
            echo "刷入顺序：AK3 内核包 → 重启 → KernelSU 管理器安装本模块 zip → 重启。"
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # Job 2.7: 抓取匹配版本的官方 KernelSU-Next 管理器 APK（普通版 + spoof 版）
  #
  #   为什么不自己编译：内核在 Kbuild 里烧录了官方签名的哈希
  #   （EXPECTED_MANAGER_HASH），自建管理器用了别的签名，内核不认，装上也拿不到 root。
  #   所以这里直接从 KernelSU-Next 官方 release 里挑「版本号最接近本次内核」的那个。
  #   版本号算法：KSU_VERSION = 30000 + git 提交数（与内核 Kbuild 一致）。
  # ===========================================================================
  manager:
    name: Fetch KernelSU-Next Manager
    needs: resolve
    if: ${{ needs.resolve.result == 'success' && inputs.fetch_manager && !inputs.list_only }}
    runs-on: ubuntu-latest
    outputs:
      picked: ${{ steps.pick.outputs.picked }}
    steps:
      - name: Pick closest release
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KSUVER: ${{ needs.resolve.outputs.ksuver }}
        run: |
          set -euo pipefail
          echo "::group::在官方 release 里挑版本号最接近 $KSUVER 的管理器"
          curl -fsSL --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/releases?per_page=30" \
            -o /tmp/rel.json
          # 每个取版本号 N、tag、普通 apk 资产名、spoof apk 资产名
          jq -r '
            .[] | . as $r |
            ([$r.assets[]?.name | select(test("KernelSU_Next_.*[0-9]{5}-release\\.apk$"))
               | select(test("spoofed") | not)]) as $apks |
            ([$r.assets[]?.name | select(test("KernelSU_Next_.*spoofed.*[0-9]{5}-release\\.apk$"))]) as $sp |
            select(($apks | length) > 0) |
            ($apks[0] | capture("_(?<num>[0-9]{5})-release\\.apk$").num) as $num |
            "\($num)\t\($r.tag_name)\t\($apks[0])\t\(if ($sp | length) > 0 then $sp[0] else "" end)"
          ' /tmp/rel.json > /tmp/candidates.tsv
          echo "候选（版本号 tag 普通版 spoof版）:"
          cat /tmp/candidates.tsv | sed 's/^/  /'
          [ -s /tmp/candidates.tsv ] || { echo "::warning::官方没有可用的管理器 release"; echo "picked=none" >> "$GITHUB_OUTPUT"; exit 0; }

          # 先挑 ≤ KSUVER 里最大的；都不满足就挑最小的
          PICK=$(awk -F'\t' -v k="$KSUVER" '$1 <= k' /tmp/candidates.tsv | sort -t$'\t' -k1,1n | tail -1)
          [ -n "$PICK" ] || PICK=$(sort -t$'\t' -k1,1n /tmp/candidates.tsv | head -1)
          NUM=$(echo "$PICK" | cut -f1); TAG=$(echo "$PICK" | cut -f2)
          NORMAL=$(echo "$PICK" | cut -f3); SPOOF=$(echo "$PICK" | cut -f4)
          echo "选定: tag=$TAG  版本号=$NUM  (内核=$KSUVER, 差值 $((KSUVER - NUM)))"
          echo "picked=$TAG" >> "$GITHUB_OUTPUT"
          {
            echo "MANAGER_TAG=$TAG"
            echo "MANAGER_NUM=$NUM"
            echo "MANAGER_NORMAL=$NORMAL"
            echo "MANAGER_SPOOF=$SPOOF"
          } >> "$GITHUB_ENV"
          echo "::endgroup::"

      - name: Download manager APKs
        if: ${{ env.MANAGER_TAG != '' && env.MANAGER_TAG != 'none' }}
        env:
          BASE: https://github.com/KernelSU-Next/KernelSU-Next/releases/download/${{ env.MANAGER_TAG }}
        run: |
          set -euo pipefail
          mkdir -p manager
          dl() {
            local name="$1"
            [ -n "$name" ] || return 0
            for i in 1 2 3; do
              curl -fsSL --retry 3 --retry-all-errors --max-time 600 \
                -o "manager/$name" "$BASE/$name" && return 0
              echo "  第 $i 次下载 $name 失败，重试..."; sleep 5
            done
            echo "::warning::管理器 $name 下载失败，跳过"
            rm -f "manager/$name"; return 0
          }
          dl "$MANAGER_NORMAL"
          dl "$MANAGER_SPOOF"
          ls -la manager/
          for f in manager/*.apk; do
            [ -e "$f" ] || continue
            echo "$f  $(stat -c%s "$f") bytes"
          done

      - name: Upload manager APK (normal)
        if: ${{ env.MANAGER_NORMAL != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.MANAGER_NORMAL }}
          path: manager/${{ env.MANAGER_NORMAL }}
          archive: false
          compression-level: 0
          retention-days: 90

      - name: Upload manager APK (spoofed)
        if: ${{ env.MANAGER_SPOOF != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.MANAGER_SPOOF }}
          path: manager/${{ env.MANAGER_SPOOF }}
          archive: false
          compression-level: 0
          retention-days: 90

      - name: Summary
        if: always()
        run: |
          {
            echo ""
            echo "### KernelSU-Next 管理器 — ${{ job.status == 'success' && '✅ 已抓取' || '❌ 失败' }}"
            echo ""
            if [ "${{ env.MANAGER_TAG }}" = "" ] || [ "${{ env.MANAGER_TAG }}" = "none" ]; then
              echo "未找到合适的官方 release，跳过。"
            else
              echo "| 项目 | 值 |"
              echo "|------|-----|"
              echo "| release | \`${{ env.MANAGER_TAG }}\` |"
              echo "| 管理器版本号 | ${{ env.MANAGER_NUM }}（本次内核 ${{ needs.resolve.outputs.ksuver }}） |"
              echo "| 普通版 | \`${{ env.MANAGER_NORMAL }}\` |"
              echo "| spoof 版 | \`${{ env.MANAGER_SPOOF }}\` |"
              echo ""
              echo "> 内核里烧录的是官方签名哈希，所以**必须装官方签名的管理器**；"
              echo "> 自建管理器（签名不同）内核不认。版本号略有差异不影响使用，"
              echo "> 只要内核和管理器都来自 KernelSU-Next 同一代码线即可。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # Job 3: 可选 —— 创建 Release
  # ===========================================================================
  release:
    name: Create release
    needs: [resolve, build, lkm, manager]
    if: >-
      ${{ !cancelled() && inputs.make_release
          && (needs.build.result == 'success' || needs.build.result == 'skipped')
          && (needs.lkm.result == 'success' || needs.lkm.result == 'skipped')
          && (needs.manager.result == 'success' || needs.manager.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      # 不用 actions/download-artifact：它对 archive:false 上传的 artifact 行为不确定
      # （可能把 AK3 / 模块 zip 当成压缩包解开）。这里直接用 artifact API，
      # 该接口对 archive:false 的 artifact 返回的就是原始文件本身。
      - name: Download all artifacts (raw, via API)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p ./ak3 ./lkm ./manager
          api="https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}/artifacts"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" "$api" -o /tmp/arts.json
          n=0
          while IFS=$'\t' read -r id name; do
            [ -z "${name:-}" ] && continue
            case "$name" in
              AK3_*)            dest="./ak3/$name" ;;
              SUSFS-LKM-*)      dest="./lkm/$name" ;;
              KernelSU_Next_*)  dest="./manager/$name" ;;
              *)                echo "  跳过 $name"; continue ;;
            esac
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${REPO}/actions/artifacts/${id}/zip" -o "$dest"
            echo "  ↓ $dest  ($(stat -c%s "$dest") bytes)"
            n=$((n + 1))
          done < <(jq -r '.artifacts[] | "\(.id)\t\(.name)"' /tmp/arts.json)
          echo "共下载 $n 个产物"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="op-ksun-$(date -u +%Y%m%d-%H%M%S)"
          COUNT=$(find ./ak3 -maxdepth 1 -name '*.zip' | wc -l)
          LCOUNT=$(find ./lkm -maxdepth 1 -name '*.zip' | wc -l)
          echo "AK3 包 $COUNT 个，LKM 模块 $LCOUNT 个"
          find ./ak3 ./lkm -maxdepth 1 -name '*.zip' -printf '%f  (%s bytes)\n' | sort

          {
            echo "# OnePlus KernelSU-Next 构建"
            echo ""
            echo "**触发参数**：device=\`${{ inputs.device }}\` / android=\`${{ inputs.android_version }}\` / susfs_mode=\`${{ inputs.susfs_mode }}\` / ksu_ref=\`${{ inputs.ksu_ref }}\` / optimize=\`${{ inputs.optimize_level }}\`"
            echo ""
            if [ "$LCOUNT" -gt 0 ]; then
              echo "> **LKM 模式**：内核使用最新 KernelSU-Next（不打 SUSFS 源码补丁），SUSFS 由下面的模块 zip 提供。"
              echo "> 刷入顺序：先刷 AK3 内核包 → 重启 → 在 KernelSU 管理器安装 LKM 模块 zip → 重启。"
              echo ""
            fi
            echo "**AK3 内核包**（$COUNT 个）"
            echo ""
            echo "| 文件 |"
            echo "|------|"
            find ./ak3 -maxdepth 1 -name '*.zip' -printf '| `%f` |\n' | sort
            if [ "$LCOUNT" -gt 0 ]; then
              echo ""
              echo "**SUSFS LKM 模块**（$LCOUNT 个）"
              echo ""
              echo "| 文件 |"
              echo "|------|"
              find ./lkm -maxdepth 1 -name '*.zip' -printf '| `%f` |\n' | sort
            fi
            MCOUNT=$(find ./manager -maxdepth 1 -name '*.apk' 2>/dev/null | wc -l)
            if [ "$MCOUNT" -gt 0 ]; then
              echo ""
              echo "**KernelSU-Next 管理器**（$MCOUNT 个，官方签名，可直接安装）"
              echo ""
              echo "| 文件 |"
              echo "|------|"
              find ./manager -maxdepth 1 -name '*.apk' -printf '| `%f` |\n' | sort
            fi
          } > release_notes.md

          ASSETS=()
          while IFS= read -r f; do [ -n "$f" ] && ASSETS+=("$f"); done < <(find ./ak3 ./lkm -maxdepth 1 -name '*.zip' | sort)
          while IFS= read -r f; do [ -n "$f" ] && ASSETS+=("$f"); done < <(find ./manager -maxdepth 1 -name '*.apk' 2>/dev/null | sort)
          [ ${#ASSETS[@]} -gt 0 ] || { echo "::error::没有任何产物可发布"; exit 1; }

          gh release create "$TAG" \
            --title "OnePlus KernelSU-Next (${{ inputs.device }}) $TAG" \
            --notes-file release_notes.md \
            "${ASSETS[@]}"
